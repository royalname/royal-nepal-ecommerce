{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">Create Account</h2>

            <form method="POST">

                {% csrf_token %}

                <input type="text"
                       name="first_name"
                       class="form-control mb-3"
                       placeholder="First Name"
                       required>

                <input type="text"
                       name="last_name"
                       class="form-control mb-3"
                       placeholder="Last Name"
                       required>

                <input type="text"
                       name="username"
                       class="form-control mb-3"
                       placeholder="Username"
                       required>

                <input type="email"
                       name="email"
                       class="form-control mb-3"
                       placeholder="Email Address"
                       required>

                <input type="password"
                       name="password"
                       class="form-control mb-3"
                       placeholder="Password"
                       required>

                <input type="password"
                       name="confirm_password"
                       class="form-control mb-3"
                       placeholder="Confirm Password"
                       required>

                <button class="btn btn-success w-100">
                    Register
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
